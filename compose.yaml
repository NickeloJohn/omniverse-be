services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: marsnav
      POSTGRES_USER: marsnav
      POSTGRES_PASSWORD: marsnav
    ports:
      - "${MARSNAV_DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marsnav -d marsnav"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: MARS-NAV API
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://marsnav:marsnav@db:5432/marsnav
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      LOG_LEVEL: INFO
      DATA_DIR: /data
    volumes:
      - raster_data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  raster_data: